<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1685e8">

<style>
:root{--blue:#1685e8;--green:#08c66b;--orange:#ff8500;--yellow:#ffc400;--teal:#09bdbb;--purple:#7850c8;--red:#f04432;--ink:#202634;--muted:#687386;--line:#e8edf3;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.mark{width:38px;height:38px;background:linear-gradient(135deg,var(--blue) 0 33%,var(--green) 33% 66%,var(--orange) 66%);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.brand b{font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px}.nav-label{font-size:10px;color:#9aa3b2;font-weight:800;letter-spacing:.12em;padding:0 10px;margin-bottom:6px}.nav{display:grid;gap:4px}.nav button{background:transparent;text-align:left;color:#647084;font-weight:600}.nav button.active,.nav button:hover{background:#eaf4ff;color:var(--blue)}.nav button span{display:inline-block;width:25px}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px;color:var(--muted);font-size:11px}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.top h1{font-size:17px;margin:0}.top p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-right{display:flex;align-items:center;gap:10px}.role-select{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink)}.avatar{width:34px;height:34px;border-radius:50%;background:#eaf4ff;color:var(--blue);display:grid;place-items:center;font-weight:800}.content{padding:28px 30px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.welcome h2{font-size:24px;margin:0 0 4px}.welcome p{margin:0;color:var(--muted)}.primary{background:var(--blue);color:white}.soft{background:#eaf4ff;color:var(--blue)}.danger{background:#fff0ee;color:#c63c30}.success{background:#e8fbf1;color:#13834a}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600;font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}.stat strong{display:block;font-size:27px;margin-top:10px;letter-spacing:-.04em}.stat small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.panel h3{margin:0;font-size:15px}.panel-head small{color:var(--muted)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eef1f5;font-size:12px}th{color:#8993a3;font-size:10px;text-transform:uppercase;letter-spacing:.06em}td b{font-size:12px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750}.pending{background:#fff5dc;color:#986400}.approved{background:#e8fbf1;color:#16834c}.rejected{background:#fff0ee;color:#bd3d32}.muted{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;min-width:0;width:100%;outline:none}.filters input{max-width:260px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#4d586a}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field.full{grid-column:1/-1}.modal-bg{position:fixed;inset:0;background:#11182788;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:16px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.close{background:#f0f2f5;color:#4c5565;padding:7px 10px}.notice{padding:12px 14px;border-radius:10px;background:#fff5dc;color:#765000;font-size:12px;margin-bottom:14px}.notice.red{background:#fff0ee;color:#9c3027}.row-actions{display:flex;gap:6px}.row-actions button{padding:6px 9px;font-size:11px}.bar{height:7px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}.team-row{margin:14px 0}.team-row div:first-child{display:flex;justify-content:space-between;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#202634;color:white;padding:12px 16px;border-radius:11px;display:none;z-index:9;box-shadow:0 8px 30px #0002}.toast.show{display:block}.mobile-menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;left:-260px;top:0;bottom:0;width:245px;transition:left .2s;box-shadow:0 0 40px #0002}.side.open{left:0}.mobile-menu{display:inline-block;background:#f0f4f8}.top{padding:0 16px}.content{padding:22px 16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}@media(max-width:520px){.welcome{align-items:flex-start;flex-direction:column}.top h1{font-size:15px}.top p{display:none}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.role-select{max-width:135px;font-size:11px}}
.sidebar-toggle{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:10px;background:#f5f7fb;color:#556174;border:1px solid var(--line);padding:9px 10px;text-align:left}.sidebar-toggle:hover{background:#eaf4ff;color:var(--blue)}.sidebar-toggle>span:first-child{display:inline-grid;place-items:center;flex:0 0 22px;font-size:20px;line-height:1}.sidebar-toggle-label{font-size:12px}.nav button{display:flex;align-items:center;gap:8px}.nav .nav-icon{display:inline-grid;place-items:center;flex:0 0 25px;font-size:16px}.nav .nav-text{min-width:0}.foot-mark{display:none}.data-boundary{display:flex;align-items:flex-start;gap:10px;background:#fff5dc;color:#765000;border:1px solid #f1dfaa;border-radius:11px;padding:12px 14px;margin-bottom:18px;font-size:12px}.data-boundary strong{white-space:nowrap}.data-boundary span{color:#765000}.side-foot{display:flex;align-items:center;gap:8px}.mobile-menu{border-radius:9px;padding:9px 11px}
@media(min-width:901px){.app{grid-template-columns:245px minmax(0,1fr);transition:grid-template-columns .2s ease}.app.sidebar-collapsed{grid-template-columns:76px minmax(0,1fr)}.app.sidebar-collapsed .side{padding:22px 8px;align-items:stretch}.app.sidebar-collapsed .brand{justify-content:center;padding:0}.app.sidebar-collapsed .brand>div:last-child,.app.sidebar-collapsed .nav-label,.app.sidebar-collapsed .nav .nav-text,.app.sidebar-collapsed .side-foot .foot-text,.app.sidebar-collapsed .sidebar-toggle-label{display:none}.app.sidebar-collapsed .sidebar-toggle{justify-content:center;padding:9px}.app.sidebar-collapsed .nav button{justify-content:center;padding:10px 0}.app.sidebar-collapsed .nav .nav-icon{flex-basis:38px;height:38px}.app.sidebar-collapsed .side-foot{justify-content:center;padding:12px 0}.app.sidebar-collapsed .foot-mark{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;font-weight:800;color:var(--muted)}}
@media(max-width:900px){.side{width:245px;padding:22px 16px;left:-260px}.app.sidebar-collapsed{grid-template-columns:1fr}.data-boundary{display:grid;gap:3px}.data-boundary strong{white-space:normal}}@media(prefers-reduced-motion:reduce){.app,.side{transition:none}}
</style></head>
<body><div class="app" id="app"><aside class="side" id="sidebar"><div class="brand"><div class="mark"></div><div><b>iGT B2B Hub</b><small>AIESEC in Ruhuna · Winter 26.27</small></div></div><button class="sidebar-toggle" id="sidebarToggle" type="button" onclick="toggleSidebar()" aria-label="Collapse sidebar" aria-controls="sidebar" aria-expanded="true" title="Collapse sidebar"><span aria-hidden="true">«</span><span class="sidebar-toggle-label">Minimise menu</span></button><div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div class="side-foot" title="Synthetic test data only. No secure login or shared database."><span class="foot-mark" aria-hidden="true">i</span><span class="foot-text">Synthetic test data only. Saved in this browser; no secure login or shared database.</span></div></aside><main class="main"><header class="top"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="mobileMenu" type="button" onclick="toggleMobileMenu()" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false" title="Open navigation">☰</button><div><h1 id="pageTitle">Overview</h1><p>Business development workspace</p></div></div><div class="top-right"><select class="role-select" id="role" aria-label="Preview role"><option>Member</option><option>TL</option><option>Manager</option><option>Specialist</option><option>LCVP</option></select><div class="avatar" id="avatar">M</div></div></header><section class="content" id="view"></section></main></div>
<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Add company</h3><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const initial=[{id:1,name:'Sample Company 001',address:'Sample location 1',member:'You',team:'Team A',opportunity:'iGTa',pic:'Sample Contact 001',email:'contact001@example.invalid',phone:'-',status:'New lead',crm:'Approved',calls:2,created:'2026-11-03'},{id:2,name:'Sample Company 002',address:'Sample location 2',member:'You',team:'Team A',opportunity:'iGTe',pic:'Sample Contact 002',email:'contact002@example.invalid',phone:'-',status:'Contacted',crm:'Pending',calls:1,created:'2026-11-08'},{id:3,name:'Sample Company 003',address:'Sample location 3',member:'Sample Member A',team:'Team A',opportunity:'iGTa',pic:'-',email:'-',phone:'-',status:'New lead',crm:'Pending',calls:0,created:'2026-11-09'},{id:4,name:'Sample Company 004',address:'Sample location 4',member:'Sample Member B',team:'Team B',opportunity:'iGTe',pic:'-',email:'-',phone:'-',status:'New lead',crm:'Rejected',reason:'Already exists in the CRM',calls:0,created:'2026-11-01'},{id:5,name:'Sample Company 005',address:'Sample location 5',member:'Sample Member A',team:'Team A',opportunity:'iGTa',pic:'-',email:'-',phone:'-',status:'Proposal sent',crm:'Approved',calls:4,created:'2026-11-04'},{id:6,name:'Sample Company 006',address:'Sample location 6',member:'Sample Member C',team:'Team B',opportunity:'iGTe',pic:'-',email:'-',phone:'-',status:'Warm lead',crm:'Approved',calls:3,created:'2026-11-05'}];let companies=JSON.parse(localStorage.getItem('igtCompanies')||'null')||initial;let activities=JSON.parse(localStorage.getItem('igtActivities')||'[]');let page='Overview';let role='Member';let memberName='You';const save=()=>{localStorage.setItem('igtCompanies',JSON.stringify(companies));localStorage.setItem('igtActivities',JSON.stringify(activities))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isAdmin=()=>['Manager','Specialist','LCVP'].includes(role);const canReview=()=>role!=='Member';const visible=()=>role==='Member'?companies.filter(c=>c.member===memberName):role==='TL'?companies.filter(c=>c.team==='Team A'):companies;const pill=s=>`<span class="pill ${s==='Approved'?'approved':s==='Rejected'?'rejected':'pending'}">${esc(s)}</span>`;const toast=s=>{let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};
const navItems=()=>role==='Member'?[['Overview','◫'],['My Companies','▤'],['My Calls','☎']]:role==='TL'?[['Overview','◫'],['Team Companies','▤'],['CRM Review','✓'],['Team Performance','▥'],['CRM Rejected','⊘']]:[['Overview','◫'],['All Companies','▤'],['CRM Review','✓'],['CRM Rejected','⊘'],['Organisation Performance','▥']];function renderNav(){let items=navItems();if(!items.some(x=>x[0]===page))page='Overview';$('#nav').innerHTML=items.map(([n,i])=>'<button type="button" class="'+(page===n?'active':'')+'" data-page="'+esc(n)+'" aria-label="'+esc(n)+'" aria-current="'+(page===n?'page':'false')+'" title="'+esc(n)+'" onclick="go(this.dataset.page)"><span class="nav-icon" aria-hidden="true">'+i+'</span><span class="nav-text">'+esc(n)+'</span></button>').join('')}function setMobileMenuOpen(open){$('#sidebar').classList.toggle('open',open);$('#mobileMenu').setAttribute('aria-expanded',String(open));$('#mobileMenu').setAttribute('aria-label',open?'Close navigation':'Open navigation');$('#mobileMenu').setAttribute('title',open?'Close navigation':'Open navigation');updateSidebarControls()}
function toggleMobileMenu(){setMobileMenuOpen(!$('#sidebar').classList.contains('open'))}
function toggleSidebar(){if(window.matchMedia('(max-width: 900px)').matches){setMobileMenuOpen(false);return}const collapsed=$('#app').classList.toggle('sidebar-collapsed');try{localStorage.setItem('igtSidebarCollapsed',String(collapsed))}catch{};updateSidebarControls()}
function updateSidebarControls(){const mobile=window.matchMedia('(max-width: 900px)').matches,open=$('#sidebar').classList.contains('open'),collapsed=$('#app').classList.contains('sidebar-collapsed'),label=mobile?(open?'Close navigation':'Open navigation'):(collapsed?'Expand sidebar':'Collapse sidebar');const button=$('#sidebarToggle');button.setAttribute('aria-label',label);button.setAttribute('title',label);button.setAttribute('aria-expanded',String(mobile?open:!collapsed));button.innerHTML='<span aria-hidden="true">'+(mobile?(open?'×':'☰'):(collapsed?'»':'«'))+'</span><span class="sidebar-toggle-label">'+label+'</span>';$('#mobileMenu').setAttribute('aria-expanded',String(open))}
function go(p){page=p;setMobileMenuOpen(false);render()}
function render(){renderNav();$('#pageTitle').textContent=page;$('#avatar').textContent=role[0];let v=$('#view'),body='';if(page==='Overview')body=overview();else if(page==='My Companies'||page==='Team Companies'||page==='All Companies')body=companyPage();else if(page==='CRM Review')body=reviewPage();else if(page==='CRM Rejected')body=rejectedPage();else if(page==='My Calls')body=callsPage();else body=performancePage();v.innerHTML='<div class="data-boundary" role="note"><strong>Synthetic test data</strong><span>No Team Jathushihan worksheet records are loaded. Use sample records only. This public prototype has no login, shared database or role security.</span></div>'+body;updateSidebarControls()}
function overview(){let list=visible(),pending=list.filter(c=>c.crm==='Pending').length,approved=list.filter(c=>c.crm==='Approved').length,rejected=list.filter(c=>c.crm==='Rejected').length,calls=list.reduce((a,c)=>a+c.calls,0);let title=role==='Member'?'Your workspace':role==='TL'?'Team overview':'Organisation overview';return `<div class="welcome"><div><h2>${title}</h2><p>${role==='Member'?'Track your companies, calls and progress.':role==='TL'?'Monitor your team and review submitted companies.':'Organisation-wide visibility across teams and CRM.'}</p></div>${role==='Member'?'<button class="primary" onclick="openAdd()">＋ Add company</button>':''}</div><div class="stats">${stat('My companies',role==='Member'?list.length:list.length,'▤','#eaf4ff','#1685e8')}${stat('CRM pending',pending,'◷','#fff5dc','#b47a00')}${stat('Approved',approved,'✓','#e8fbf1','#15965a')}${stat(role==='Member'?'Calls logged':'CRM rejected',role==='Member'?calls:rejected,role==='Member'?'☎':'⊘','#f1eaff','#7850c8')}</div><div class="grid2"><div class="panel"><div class="panel-head"><h3>${role==='Member'?'Recently added companies':'Recent company submissions'}</h3><small>Latest activity</small></div>${table(list.slice().sort((a,b)=>b.id-a.id).slice(0,5),false)}</div><div class="panel"><div class="panel-head"><h3>CRM status</h3><small>Visible records</small></div>${[['Approved',approved,'#08c66b'],['Pending',pending,'#ffc400'],['Rejected',rejected,'#f04432']].map(([n,x,c])=>`<div class="team-row"><div><span>${n}</span><b>${x}</b></div><div class="bar"><i style="width:${list.length?x/list.length*100:0}%;background:${c}"></i></div></div>`).join('')}<div class="notice" style="margin-top:18px">Synthetic sample records are loaded for workflow testing. They are not imported from the Team Jathushihan worksheet.</div></div></div>`}
function stat(n,x,ic,bg,fg){return `<div class="stat"><div class="stat-top">${n}<span class="stat-icon" style="background:${bg};color:${fg}">${ic}</span></div><strong>${x}</strong><small>Current records</small></div>`}
function table(list,actions=true){if(!list.length)return '<div class="empty">No companies found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Company</th><th>Owner</th><th>Opportunity</th><th>CRM status</th><th>Outreach</th>${actions&&canReview()?'<th>Action</th>':''}</tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="muted">${esc(c.address)}</span></td><td>${esc(c.member)}</td><td>${esc(c.opportunity)}</td><td>${pill(c.crm)}</td><td>${c.calls} calls</td>${actions&&canReview()?`<td>${c.crm==='Pending'?`<div class="row-actions"><button class="success" onclick="decide(${c.id},'Approved')">Approve</button><button class="danger" onclick="rejectPrompt(${c.id})">Reject</button></div>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function companyPage(){let list=visible();return `<div class="welcome"><div><h2>${page}</h2><p>${role==='Member'?'Only companies submitted by you are shown here.':'Companies visible to your role.'}</p></div>${role==='Member'?'<button class="primary" onclick="openAdd()">＋ Add company</button>':''}</div><div class="panel"><div class="filters"><input id="search" placeholder="Search company or address…" oninput="filterRows()"><select id="crmFilter" onchange="filterRows()"><option value="">All CRM statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option></select></div><div id="companyRows">${table(list)}</div></div>`}
function filterRows(){let q=$('#search').value.toLowerCase(),s=$('#crmFilter').value;let list=visible().filter(c=>(c.name+' '+c.address).toLowerCase().includes(q)&&(!s||c.crm===s));$('#companyRows').innerHTML=table(list)}function reviewPage(){let list=companies.filter(c=>c.crm==='Pending');if(role==='TL')list=list.filter(c=>c.team==='Team A');return `<div class="welcome"><div><h2>Pending CRM review</h2><p>Review company details before allowing outreach to proceed.</p></div><span class="pill pending">${list.length} awaiting review</span></div><div class="panel">${table(list)}</div>`}function rejectedPage(){let list=companies.filter(c=>c.crm==='Rejected');if(role==='TL')list=list.filter(c=>c.team==='Team A');return `<div class="welcome"><div><h2>CRM rejected companies</h2><p>These records are retained to prevent duplicate submissions.</p></div></div><div class="panel">${table(list,false)}</div>`}
function callsPage(){let list=visible();return `<div class="welcome"><div><h2>My calls</h2><p>Log outreach against your own companies.</p></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Company</th><th>CRM</th><th>Calls logged</th><th>Action</th></tr></thead><tbody>${list.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${pill(c.crm)}</td><td>${c.calls}</td><td><button class="soft" onclick="logCall(${c.id})" ${c.crm!=='Approved'?'disabled title="CRM approval required"':''}>＋ Log call</button></td></tr>`).join('')}</tbody></table></div></div>`}function performancePage(){let list=visible(),teams=[...new Set(list.map(c=>c.team))];return `<div class="welcome"><div><h2>${page}</h2><p>Company pipeline and outreach activity.</p></div></div><div class="stats">${stat('Companies',list.length,'▤','#eaf4ff','#1685e8')}${stat('Approved',list.filter(c=>c.crm==='Approved').length,'✓','#e8fbf1','#15965a')}${stat('Pending',list.filter(c=>c.crm==='Pending').length,'◷','#fff5dc','#b47a00')}${stat('Calls logged',list.reduce((a,c)=>a+c.calls,0),'☎','#f1eaff','#7850c8')}</div><div class="panel"><h3>Team breakdown</h3>${teams.map(t=>{let a=list.filter(c=>c.team===t);return `<div class="team-row"><div><span>${esc(t)}</span><b>${a.length} companies · ${a.reduce((x,c)=>x+c.calls,0)} calls</b></div><div class="bar"><i style="width:${list.length?a.length/list.length*100:0}%"></i></div></div>`}).join('')}</div>`}
function openAdd(){if(role!=='Member')return;$('#modalTitle').textContent='Submit a company';$('#modalBody').innerHTML=`<div class="notice red">Use synthetic test values only. This public app stores entries in this browser without login or secure access controls.</div><form onsubmit="submitCompany(event)"><div class="form-grid"><div class="field"><label>Company name *</label><input name="name" required></div><div class="field"><label>Opportunity *</label><select name="opportunity"><option>iGTa</option><option>iGTe</option></select></div><div class="field"><label>Address / location *</label><input name="address" required></div><div class="field"><label>Contact person (PIC)</label><input name="pic"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Contact number</label><input name="phone"></div><div class="field full"><label>Additional details</label><textarea name="notes" rows="3"></textarea></div></div><button class="primary" type="submit">Submit for CRM review</button></form>`;$('#modalBg').classList.add('open')}
function submitCompany(e){e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),match=companies.find(c=>c.name.trim().toLowerCase()===name.toLowerCase());if(match){if(match.crm==='Rejected'){alert(`CRM REJECTED: “${match.name}” was previously rejected. Reason: ${match.reason||'Not provided'}. Please contact your TL before trying again.`)}else alert(`Possible duplicate: “${match.name}” already exists with CRM status ${match.crm}. Please check with your TL.`);return}let c={id:Math.max(0,...companies.map(x=>x.id))+1,name,address:f.get('address'),member:memberName,team:'Team A',opportunity:f.get('opportunity'),pic:f.get('pic')||'-',email:f.get('email')||'-',phone:f.get('phone')||'-',notes:f.get('notes')||'',status:'New lead',crm:'Pending',calls:0,created:new Date().toISOString().slice(0,10)};companies.push(c);save();closeModal();render();toast('Company submitted for CRM review')}
function decide(id,status,reason=''){let c=companies.find(x=>x.id===id);if(!c)return;c.crm=status;if(status==='Rejected')c.reason=reason;c.reviewedBy=role;c.reviewedAt=new Date().toISOString();save();render();toast(`Company ${status.toLowerCase()}`)}function rejectPrompt(id){let r=prompt('Reason for CRM rejection (required):');if(r===null)return;if(!r.trim()){alert('Please enter a rejection reason.');return}decide(id,'Rejected',r.trim())}function logCall(id){let c=companies.find(x=>x.id===id);if(!c||c.crm!=='Approved')return;c.calls++;activities.push({id,date:new Date().toISOString(),company:c.name,member:memberName});save();render();toast('Call activity logged')}function closeModal(){$('#modalBg').classList.remove('open')}
try{if(window.matchMedia('(min-width: 901px)').matches&&localStorage.getItem('igtSidebarCollapsed')==='true')$('#app').classList.add('sidebar-collapsed')}catch{}
window.addEventListener('resize',updateSidebarControls);$('#role').addEventListener('change',e=>{role=e.target.value;page='Overview';render()});$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});updateSidebarControls();render();
</script></body></html>
